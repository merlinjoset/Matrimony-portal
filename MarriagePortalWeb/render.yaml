# Render Blueprint - CSI Holy Matrimony (single Next.js 16 app: web UI + API routes).
# The API lives inside this app under /api and talks to Neon directly.
services:
  - type: web
    name: csi-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Neon connection string - paste in the dashboard (kept out of git).
      # Used server-side by the /api route handlers.
      - key: DATABASE_URL
        sync: false
